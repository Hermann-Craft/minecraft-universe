<!DOCTYPE html>
<html>
<head>
    <title>Magic Programming (Safe)</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <style>
        #code { width: 600px; height: 100px; }
        .spell { background: #2c3e50; padding: 10px; margin: 5px; color: white; }
    </style>
</head>
<body>
    <div id="gameContainer"></div>
    <div>
        <div class="spell" onclick="useSpell('basicAttack')">
            🔥 Attaque de base (10 mana) : attack(10)
        </div>
        <div class="spell" onclick="useSpell('heal')">
            💖 Soin (20 mana) : heal(15)
        </div>
    </div>
    <textarea id="code" placeholder="Écris ta combinaison ici... Exemple: attack(10); heal(5);"></textarea>
    <button onclick="executeCustomSpell()">Lancer le sort</button>
    <div id="status"></div>

<script>
let player = { mana: 100, hp: 100 };
let enemy = { hp: 100 };

// ACTIONS AUTORISÉES
const SPELLS = {
    attack: (dmg) => {
        if (player.mana >= 10) {
            enemy.hp -= dmg;
            player.mana -= 10;
            return `Attaque de ${dmg}!`;
        }
        return "Pas assez de mana pour attaquer!";
    },
    heal: (amount) => {
        if (player.mana >= 20) {
            player.hp += amount;
            player.mana -= 20;
            return `Soin de ${amount} HP!`;
        }
        return "Pas assez de mana pour soigner!";
    }
};

function executeCustomSpell() {
    const code = document.getElementById('code').value;
    const output = [];
    
    try {
        // Sandbox ultra-restrictif
        const commands = code.split(';');
        for (let cmd of commands) {
            const match = cmd.match(/(\w+)\((\d+)\)/);
            if (!match) continue;
            
            const [_, action, arg] = match;
            if (!SPELLS[action]) {
                output.push(`Action interdite: ${action}`);
                continue;
            }
            
            output.push(SPELLS[action](Number(arg)));
        }
    } catch(e) {
        output.push("Erreur de syntaxe !");
    }
    
    updateGameState(output);
}

function updateGameState(output) {
    document.getElementById('status').innerHTML = `
        ${output.join('<br>')}
        <hr>
        Joueur: ${player.hp} HP, ${player.mana} Mana<br>
        Ennemi: ${enemy.hp} HP
    `;
    
    if (enemy.hp <= 0) alert("Victoire !");
}
</script>
</body>
</html>
